<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Scraper & Summarizer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex flex-col items-center py-10 px-4">

    <!-- Ana Konteyner -->
    <div class="max-w-3xl w-full bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 border border-gray-700">
        
        <!-- Başlık Bölümü -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
                🚀 AI Haber Özetleyici
            </h1>
            <p class="text-gray-400 text-sm md:text-base">
                Herhangi bir haber linkini yapıştırın, yapay zeka saniyeler içinde özetlesin.
            </p>
        </div>

        <!-- Form Alanı -->
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Haber URL Adresi</label>
                <input type="url" name="url" placeholder="https://www.bbcturkce.com/..." required
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-gray-400 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Özet Formatı</label>
                <select name="format" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-white transition cursor-pointer">
                    <option value="maddeli">📌 Maddeler Halinde Özet</option>
                    <option value="tek_cumle">🎯 1 Cümlelik Yönetici Özeti</option>
                    <option value="tweet">🐦 Tweet / X Dizisi (SMM)</option>
                    <option value="soru_cevap">❓ 3 Soru - 3 Cevap</option>
                </select>
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform active:scale-98 transition cursor-pointer">
                Özet Çıkar
            </button>
        </form>

        <!-- Sonuç Alanı (Eğer Özet Geldiyle Göster) -->
        {% if ozet %}
            <div class="mt-8 pt-8 border-t border-gray-700 space-y-6">
                
                <!-- Haber Başlığı -->
                {% if baslik %}
                    <h2 class="text-xl md:text-2xl font-bold text-gray-100 leading-snug">
                        {{ baslik }}
                    </h2>
                {% endif %}

                <!-- Haber Görseli -->
                {% if gorsel_url %}
                    <div class="overflow-hidden rounded-xl border border-gray-700">
                        <img src="{{ gorsel_url }}" alt="Haber Görseli" class="w-full h-auto max-h-96 object-cover">
                    </div>
                {% endif %}

                <!-- AI Özeti Kutusu -->
                <div>
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <h3 class="text-lg font-semibold text-emerald-400 flex items-center gap-2">
                            <span>✨ AI Özeti</span>
                        </h3>

                        <!-- 🎧 Ses Kontrol Paneli (Ses, Hız ve Oynat) -->
                        <div class="flex items-center gap-2 bg-gray-900/60 p-1.5 rounded-xl border border-gray-700">
                            
                            <!-- 🔊 Ses Seviyesi (Slider) -->
                            <div class="flex items-center gap-1 px-1">
                                <span class="text-xs">🔊</span>
                                <input type="range" id="ses-seviyesi" min="0" max="1" step="0.1" value="1" 
                                    class="w-16 accent-emerald-500 cursor-pointer">
                            </div>

                            <!-- ⚡ Hız Seçimi -->
                            <select id="hiz-secimi" 
                                class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold py-1 px-1.5 rounded-lg border border-gray-600 focus:outline-none transition cursor-pointer">
                                <option value="0.5">0.5x</option>
                                <option value="1.0" selected>1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2.0">2.0x</option>
                            </select>

                            <!-- ▶️ Sesli Dinle / Durdur Butonu -->
                            <button type="button" onclick="seslendir()" id="ses-btn"
                                class="text-xs bg-gray-700 hover:bg-gray-600 text-blue-400 font-semibold py-1 px-2.5 rounded-lg border border-gray-600 flex items-center gap-1 transition cursor-pointer">
                                🔊 Dinle
                            </button>
                        </div>
                    </div>

                    <div id="ozet-metni" class="bg-gray-900 border border-gray-700 rounded-xl p-5 text-gray-300 leading-relaxed whitespace-pre-line text-sm md:text-base">
                        {{ ozet }}
                    </div>
                </div>

                <!-- İndirme Butonu Formu -->
                <form action="/indir" method="POST">
                    <input type="hidden" name="ozet_metni" value="{{ ozet }}">
                    <button type="submit" 
                        class="w-full bg-gray-700 hover:bg-gray-600 text-emerald-400 font-semibold py-2.5 px-4 rounded-xl border border-gray-600 flex items-center justify-center gap-2 transition cursor-pointer">
                        📥 Özeti Bilgisayara İndir (.txt)
                    </button>
                </form>

            </div>
        {% endif %}

    </div>

    <!-- 🎧 Seslendirme JavaScript Kodu -->
    <script>
        function seslendir() {
            const btn = document.getElementById("ses-btn");
            
            // Eğer zaten okunuyorsa durdur
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                btn.innerHTML = "🔊 Dinle";
                btn.classList.remove("text-red-400");
                btn.classList.add("text-blue-400");
                return;
            }

            const metin = document.getElementById("ozet-metni").innerText;
            if (!metin) return;

            // Seçilen Hız ve Ses Seviyesi Değerlerini Al
            const secilenHiz = parseFloat(document.getElementById("hiz-secimi").value) || 1.0;
            const secilenSes = parseFloat(document.getElementById("ses-seviyesi").value) ?? 1.0;

            const utterance = new SpeechSynthesisUtterance(metin);
            utterance.lang = "tr-TR";        // Türkçe Ses
            utterance.rate = secilenHiz;     // Hız (0.5x - 2.0x)
            utterance.volume = secilenSes;   // Ses Seviyesi (0.0 - 1.0)

            // Okuma başladığında butonun görünümünü değiştir
            utterance.onstart = function() {
                btn.innerHTML = "⏹️ Durdur";
                btn.classList.remove("text-blue-400");
                btn.classList.add("text-red-400");
            };

            // Okuma bittiğinde butonu sıfırla
            utterance.onend = function() {
                btn.innerHTML = "🔊 Dinle";
                btn.classList.remove("text-red-400");
                btn.classList.add("text-blue-400");
            };

            speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
